
version: 2
models:

  - name: stg_accounting_system__invoices
    description: A list of invoices
    columns:
      - name: invoice_id
        description: A unique identifier for the invoice
        data_tests:
          - unique
          - not_null
      - name: customer_remote_id
        description: A unique identifier for the customer in external system 
      - name: subsidiary_id
        description: Unique identifier of subsidiary of a company 
      - name: company_detail_id
        description: Unique identifier of company 
      - name: check_remit_item_id
        description: Item Check Remit ID
      - name: external_system_id
        description: Number of invoice
      - name: currency_iso3_code
        description: Currency Code of invoice (eg. USD)
      - name: invoice_paid_on_date
        description: Date the invoice was paid Timezone EST
      - name: invoice_created_datetime
        description: Timestamp of invoice creation Timezone EST
      - name: system_updated_datetime
        description: Timestamp of update Timezome EST

  - name: stg_accounting_system__invoice_items
    description: A list of invoices items 
    columns:
      - name: invoice_items_id
        description: An identifier for the invoice items 
        data_tests:
          - unique
          - not_null
      - name: invoice_id
        description: A unique identifier for the invoice
        tests:
          - relationships:
              to: ref('stg_accounting_system__invoices')
              field: invoice_id
          - not_null
      - name: item_remote_id
        description: External identifier for an item
      - name: quantity
        description: Number of items purchased
      - name: unit_price
        description: Cost of each item
      - name: total_amount
        description: Total spent (quantity*unit_price)
      - name: system_updated_datetime
        description: Timestamp of update Timezome EST

  - name: stg_accounting_system__items
    description: A list of invoices items 
    columns:
      - name: item_id
        description: An identifier for an item
      - name: item_remote_id
        description: External identifier for an item
      - name: company_detail_id
        description: Unique ID for a company
      - name: item_name
        description: Name of an item
      - name: system_updated_datetime
        description: Timestamp of update Timezome EST